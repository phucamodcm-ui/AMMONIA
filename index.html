<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Webapp & Link Xưởng Ammonia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #00682B;
            --primary-green-dark: #004D20;
            --primary-green-light: #E6F4EA;
            --accent-yellow: #FFC72C;
            --sidebar-bg: #032512;
            --bg-light: #F4F7F5;
            --card-bg: #FFFFFF;
            --text-main: #1A2E26;
            --text-muted: #5C7066;
            --border-color: #E2E8F0;
            --sidebar-width: 270px;
            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px -5px rgba(0, 104, 43, 0.08);
            --transition: all 0.25s ease-in-out;
        }

        [data-theme="dark"] {
            --bg-light: #0B130F;
            --card-bg: #13221A;
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            --border-color: #1E3A2F;
            --sidebar-bg: #02140A;
            --primary-green-light: #133322;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; transition: background 0.3s; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            z-index: 100;
            box-shadow: 4px 0 15px rgba(0,0,0,0.15);
            transition: var(--transition);
        }

        .sidebar-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.25);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .sidebar-brand-badge {
            background: var(--accent-yellow);
            color: #02140A;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .sidebar-brand-text h2 { font-size: 13px; font-weight: 700; color: #FFFFFF; letter-spacing: 0.3px; }
        .sidebar-brand-text span { font-size: 10.5px; color: #CBD5E0; }

        .sidebar-menu { list-style: none; padding: 14px 10px; flex-grow: 1; overflow-y: auto; }
        
        .menu-label { 
            font-size: 10.5px; 
            text-transform: uppercase; 
            letter-spacing: 1.2px; 
            color: #4ADE80; 
            margin: 16px 12px 8px 12px; 
            font-weight: 700; 
        }
        
        .sidebar-menu li a {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; color: #F1F5F9; text-decoration: none;
            border-radius: 8px; font-size: 13px; font-weight: 500;
            transition: var(--transition); margin-bottom: 3px;
        }
        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background: rgba(255, 255, 255, 0.12); color: #FFFFFF;
            transform: translateX(4px);
        }

        /* PHỐI MÀU ICON SIDEBAR CAO CẤP ĐA SẮC */
        .sidebar-menu li a i { font-size: 15px; width: 20px; text-align: center; transition: var(--transition); }
        .sidebar-menu li a i.fa-house, .sidebar-menu li a i.fa-file-signature { color: #38BDF8; }
        .sidebar-menu li a i.fa-sliders, .sidebar-menu li a i.fa-microchip, .sidebar-menu li a i.fa-chart-line { color: #34D399; }
        .sidebar-menu li a i.fa-clipboard-list, .sidebar-menu li a i.fa-book-bookmark { color: #FBBF24; }
        .sidebar-menu li a i.fa-shield-halved, .sidebar-menu li a i.fa-triangle-exclamation { color: #FB7185; }
        .sidebar-menu li a i.fa-envelope, .sidebar-menu li a i.fa-link, .sidebar-menu li a i.fa-industry { color: #C084FC; }
        .sidebar-menu li a:hover i { transform: scale(1.2); filter: drop-shadow(0 0 6px rgba(255,255,255,0.4)); }

        .sidebar-admin-footer {
            padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 8px;
        }
        .btn-sidebar-admin {
            background: rgba(255, 199, 44, 0.18); color: var(--accent-yellow); border: 1px solid rgba(255, 199, 44, 0.4);
            padding: 9px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition);
        }
        .btn-sidebar-admin:hover { background: var(--accent-yellow); color: #02140A; }

        /* --- MAIN WRAPPER --- */
        .main-wrapper { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-width: 0; }

        /* HEADER VỚI LOGO ĐẠM CÀ MAU ĐẸP HOÀN HẢO */
        .top-header {
            background: var(--card-bg); padding: 10px 28px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .header-brand-group { display: flex; align-items: center; gap: 18px; }
        
        .logo-dcm-container {
            display: flex; align-items: center; background: #ffffff;
            padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(0, 104, 43, 0.08);
        }
        .logo-svg { height: 42px; width: auto; }

        .header-title h1 { font-size: 15px; font-weight: 700; color: var(--text-main); }
        .header-title p { font-size: 11.5px; color: var(--text-muted); }

        .header-actions { display: flex; align-items: center; gap: 12px; }
        
        .theme-toggle-btn {
            background: var(--primary-green-light); color: var(--primary-green); border: none;
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 15px; transition: var(--transition);
        }
        .theme-toggle-btn:hover { transform: scale(1.05); }

        /* CONTENT */
        .content-container { padding: 24px 28px; max-width: 1400px; margin: 0 auto; width: 100%; }

        /* TOOLBAR */
        .toolbar-section {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 22px; gap: 15px; flex-wrap: wrap;
        }

        .search-box-wrapper { position: relative; flex: 1; min-width: 260px; max-width: 420px; }
        .search-box-wrapper input {
            width: 100%; padding: 11px 16px 11px 42px; border-radius: 10px;
            border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main);
            font-size: 13px; outline: none; transition: var(--transition); box-shadow: var(--shadow-sm);
        }
        .search-box-wrapper input:focus { border-color: var(--primary-green); box-shadow: 0 0 0 3px rgba(0, 104, 43, 0.12); }
        .search-box-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }

        .view-mode-buttons { display: flex; background: var(--card-bg); padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); gap: 4px; }
        .view-btn {
            background: transparent; border: none; padding: 6px 12px; border-radius: 6px;
            font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; gap: 6px;
        }
        .view-btn.active, .view-btn:hover { background: var(--primary-green); color: #fff; }

        .section-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; width: 4px; height: 15px; background: var(--primary-green); border-radius: 2px; }

        /* CARDS GRID */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; margin-bottom: 32px; }
        .sub-card {
            background: var(--card-bg); border-radius: 12px; padding: 20px;
            border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);
            text-decoration: none; color: inherit; display: flex; flex-direction: column;
            justify-content: space-between; transition: var(--transition); position: relative;
        }
        .sub-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary-green); }

        .card-header-icon {
            width: 44px; height: 44px; border-radius: 10px;
            background: var(--primary-green-light); color: var(--primary-green);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; margin-bottom: 14px; transition: var(--transition);
        }
        .sub-card:hover .card-header-icon { background: var(--primary-green); color: #fff; }

        .card-body h3 { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .card-body p { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
        .card-footer-tags { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .tag { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 10px; background: var(--primary-green-light); color: var(--primary-green); }

        /* COMPACT VIEW */
        .cards-grid.compact-view { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
        .cards-grid.compact-view .sub-card { padding: 14px; }
        .cards-grid.compact-view .card-header-icon { width: 34px; height: 34px; font-size: 14px; margin-bottom: 8px; }
        .cards-grid.compact-view .card-body p { display: none; }

        /* LIST VIEW */
        .list-table-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: var(--shadow-sm); margin-bottom: 32px; }
        .custom-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        .custom-table th { background: var(--primary-green-light); color: var(--primary-green); padding: 12px 16px; font-weight: 700; }
        .custom-table td { padding: 12px 16px; border-top: 1px solid var(--border-color); color: var(--text-main); }
        .custom-table tr:hover { background: rgba(0,0,0,0.02); }

        /* ADMIN MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(3px);
        }
        .modal {
            background: var(--card-bg); color: var(--text-main); width: 100%; max-width: 650px; border-radius: 14px; padding: 26px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
        }
        .modal h2 { font-size: 18px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); background: var(--bg-light); color: var(--text-main); border-radius: 6px; font-size: 13px; outline: none; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-primary { background: var(--primary-green); color: #fff; border: none; padding: 9px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background: var(--border-color); color: var(--text-main); border: none; padding: 9px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }

        @media(max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-wrapper { margin-left: 0; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand-badge">AMO</div>
            <div class="sidebar-brand-text">
                <h2>XƯỞNG AMMONIA</h2>
                <span>Nhà Máy Đạm Cà Mau</span>
            </div>
        </div>

        <ul class="sidebar-menu" id="sidebarNav">
            <!-- Render động -->
        </ul>

        <div class="sidebar-admin-footer">
            <button class="btn-sidebar-admin" onclick="openAdminModal()"><i class="fa-solid fa-lock" style="color:var(--accent-yellow);"></i> Quản Trị Hệ Thống</button>
        </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
        <header class="top-header">
            <div class="header-brand-group">
                <!-- LOGO ĐẠM CÀ MAU CHUẨN ĐẸP CAO CẤP -->
                <div class="logo-dcm-container">
                    <svg class="logo-svg" viewBox="0 0 280 75" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="36" cy="35" r="26" fill="#ED1C24"/>
                        <path d="M36 12 C36 12, 24 26, 24 37 C24 45, 30 50, 36 53 C42 50, 48 45, 48 37 C48 26, 36 12, 36 12 Z" fill="#FFE800"/>
                        <path d="M36 19 C36 19, 28 29, 28 38 C28 43, 32 47, 36 49 C40 47, 44 43, 44 38 C44 29, 36 19, 36 19 Z" fill="#FFC72C"/>
                        <path d="M14 47 Q36 34 58 47 L58 56 Q36 43 14 56 Z" fill="#00682B"/>
                        <text x="68" y="32" font-family="Inter, sans-serif" font-weight="800" font-size="16.5" fill="#00682B">PHÂN BÓN CÀ MAU</text>
                        <text x="68" y="49" font-family="Inter, sans-serif" font-weight="700" font-size="9" fill="#ED1C24" letter-spacing="1.5">HẠT NGỌC MÙA VÀNG</text>
                    </svg>
                </div>

                <div class="header-title">
                    <h1>Hệ thống Webapp và link Xưởng Ammonia</h1>
                    <p>Xưởng Ammonia Nhà máy Đạm Cà Mau</p>
                </div>
            </div>

            <div class="header-actions">
                <button class="theme-toggle-btn" onclick="toggleTheme()" title="Chuyển đổi Sáng / Tối">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </header>

        <main class="content-container">
            <div class="toolbar-section">
                <div class="search-box-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="Tìm kiếm nhanh ứng dụng, báo cáo, liên kết...">
                </div>

                <div class="view-mode-buttons">
                    <button class="view-btn active" onclick="switchView('grid')" id="btnGrid"><i class="fa-solid fa-grip"></i> Thẻ Lớn</button>
                    <button class="view-btn" onclick="switchView('compact')" id="btnCompact"><i class="fa-solid fa-table-cells"></i> Rút Gọn</button>
                    <button class="view-btn" onclick="switchView('list')" id="btnList"><i class="fa-solid fa-list"></i> Danh Sách</button>
                </div>
            </div>

            <div class="section-title">Danh Mục Ứng Dụng & Liên Kết Quản Lý</div>
            <div id="mainDisplayArea"></div>
        </main>
    </div>

    <!-- ADMIN MODAL CẤU HÌNH -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal">
            <h2><span><i class="fa-solid fa-gear"></i> Bảng Quản Trị Hệ Thống</span> <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeAdminModal()"></i></h2>
            
            <div id="loginSection">
                <div class="form-group">
                    <label>Mật khẩu Quản Trị</label>
                    <input type="password" id="adminPassInput" placeholder="Nhập mật khẩu quản trị (mặc định: admin123)">
                </div>
                <button class="btn-primary" onclick="verifyAdminLogin()">Đăng Nhập Quản Trị</button>
            </div>

            <div id="dashboardAdminSection" style="display:none;">
                <p style="font-size: 13px; color: var(--primary-green); font-weight: 600; margin-bottom: 14px;"><i class="fa-solid fa-circle-check"></i> Đã cấp quyền quản trị viên thành công.</p>
                
                <h3 style="font-size: 13.5px; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px;">Thêm Ứng Dụng / Link Mới</h3>
                <div class="form-group">
                    <label>Chọn Nhóm (Sidebar Section)</label>
                    <select id="itemSection">
                        <option value="overview">1. Tổng Quan</option>
                        <option value="apps">2. Các Ứng Dụng Con</option>
                        <option value="links">3. Liên Kết Nhanh</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tên hiển thị</label>
                    <input type="text" id="itemName" placeholder="Ví dụ: Giám sát Compressor KBR">
                </div>
                <div class="form-group">
                    <label>Đường dẫn URL đích</label>
                    <input type="text" id="itemUrl" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Mô tả ngắn</label>
                    <input type="text" id="itemDesc" placeholder="Mô tả công năng chi tiết...">
                </div>
                <div class="form-group">
                    <label>Chọn hoặc Nhập Icon chuyên nghiệp (FontAwesome)</label>
                    <select id="itemIconSelect" onchange="document.getElementById('itemIcon').value = this.value" style="margin-bottom:6px;">
                        <option value="fa-solid fa-industry">🏭 Nhà máy / Xưởng sản xuất (Industry)</option>
                        <option value="fa-solid fa-gauge-high">📊 Đồng hồ đo KPI / Hiệu suất (Gauge)</option>
                        <option value="fa-solid fa-shield-halved">🛡️ An toàn / PSM Management (Shield)</option>
                        <option value="fa-solid fa-triangle-exclamation">⚠️ Cảnh báo sự cố / Near-miss (Alert)</option>
                        <option value="fa-solid fa-chart-line">📈 Biểu đồ dữ liệu / Trend (Chart)</option>
                        <option value="fa-solid fa-book-bookmark">📖 Tài liệu SOP / Sổ tay (Book)</option>
                        <option value="fa-solid fa-laptop-code">💻 Hệ thống Webapp nội bộ (Code)</option>
                        <option value="fa-solid fa-screwdriver-wrench">🔧 Bảo dưỡng / Thiết bị (Tools)</option>
                    </select>
                    <input type="text" id="itemIcon" value="fa-solid fa-industry" placeholder="Hoặc nhập mã icon thủ công...">
                </div>
                <button class="btn-primary" onclick="addItem()"><i class="fa-solid fa-plus"></i> Thêm Mới Vào Hệ Thống</button>

                <h3 style="font-size: 13.5px; margin: 18px 0 8px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 4px;">Đổi Mật Khẩu Quản Trị</h3>
                <div class="form-group">
                    <label>Mật khẩu mới</label>
                    <input type="password" id="newAdminPass" placeholder="Nhập mật khẩu mới...">
                </div>
                <button class="btn-secondary" onclick="changeAdminPassword()">Cập Nhật Mật Khẩu</button>

                <h3 style="font-size: 13.5px; margin: 18px 0 8px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 4px;">Danh Sách Quản Lý & Xóa Mục</h3>
                <div id="adminItemsList" style="max-height: 150px; overflow-y: auto; font-size: 12px; border: 1px solid var(--border-color); padding: 8px; border-radius: 6px;"></div>

                <div class="modal-btns" style="margin-top: 18px;">
                    <button class="btn-secondary" onclick="resetDefaultData()">Khôi Phục Mặc Định</button>
                    <button class="btn-primary" style="background:#dc2626;" onclick="logoutAdmin()">Đăng Xuất</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT BẢO TOÀN DỮ LIỆU & ICON ĐA DẠNG -->
    <script>
        const defaultData = [
            { id: 1, section: "overview", name: "Trang Chủ Portal", url: "#", desc: "Trung tâm điều hành và tổng quan số liệu xưởng Ammonia.", icon: "fa-solid fa-house" },
            { id: 2, section: "overview", name: "Giám Sát Vận Hành", url: "#", desc: "Theo dõi các thông số nhiệt độ, áp suất, lưu lượng thiết bị.", icon: "fa-solid fa-sliders" },
            { id: 3, section: "apps", name: "Nhật Ký Ca Điện Tử", url: "#", desc: "Ghi chép thông số vận hành và nhật ký giao nhận ca trực.", icon: "fa-solid fa-clipboard-list" },
            { id: 4, section: "apps", name: "Equipment KPI", url: "#", desc: "Hiệu suất Máy nén, Lò cải biến (Reformer) và Tháp tổng hợp NH3.", icon: "fa-solid fa-microchip" },
            { id: 5, section: "apps", name: "Thư Viện SOP & WI", url: "#", desc: "Tra cứu quy trình vận hành chuẩn và hướng dẫn công việc.", icon: "fa-solid fa-book-bookmark" },
            { id: 6, section: "links", name: "E-Office PVCFC", url: "https://eoffice.pvcfc.com.vn", desc: "Hệ thống văn phòng điện tử tập đoàn Dầu khí Cà Mau.", icon: "fa-solid fa-file-signature" },
            { id: 7, section: "links", name: "Email Công Ty", url: "https://mail.pvcfc.com.vn", desc: "Hệ thống hộp thư điện tử chính thức của công ty.", icon: "fa-solid fa-envelope" }
        ];

        // Sử dụng key v4 để giữ trọn vẹn dữ liệu người dùng đã thêm từ các phiên bản trước
        let savedData = localStorage.getItem('ammonia_portal_v4_data') || localStorage.getItem('ammonia_portal_v3_data');
        let appData = savedData ? JSON.parse(savedData) : defaultData;
        let adminPass = localStorage.getItem('ammonia_admin_v4_pass') || localStorage.getItem('ammonia_admin_v3_pass') || 'admin123';
        let isAdminLoggedIn = false;
        let currentView = 'grid';

        function renderAll() {
            renderSidebar();
            renderMainContent();
            renderAdminList();
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = '';
            const sections = [
                { key: 'overview', label: 'Tổng Quan' },
                { key: 'apps', label: 'Các Ứng Dụng Con' },
                { key: 'links', label: 'Liên Kết Nhanh' }
            ];

            sections.forEach(sec => {
                nav.innerHTML += `<li class="menu-label">${sec.label}</li>`;
                const filtered = appData.filter(item => item.section === sec.key);
                filtered.forEach(item => {
                    nav.innerHTML += `<li><a href="${item.url}" target="_blank"><i class="${item.icon}"></i> ${item.name}</a></li>`;
                });
            });
        }

        function renderMainContent(filterText = '') {
            const area = document.getElementById('mainDisplayArea');
            const filtered = appData.filter(item => 
                item.name.toLowerCase().includes(filterText.toLowerCase()) || 
                item.desc.toLowerCase().includes(filterText.toLowerCase())
            );

            if(filtered.length === 0) {
                area.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:30px;">Không tìm thấy mục phù hợp.</p>`;
                return;
            }

            const deleteBtnHtml = (idx) => isAdminLoggedIn ? `<span onclick="event.preventDefault(); deleteItem(${idx})" style="color:#ef4444; font-size:11px; cursor:pointer;"><i class="fa-solid fa-trash"></i> Xóa</span>` : '';

            if(currentView === 'list') {
                let html = `
                    <div class="list-table-container">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>Icon</th>
                                    <th>Tên Ứng Dụng / Link</th>
                                    <th>Phân Nhóm</th>
                                    <th>Mô Tả</th>
                                    <th style="text-align:right;">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                filtered.forEach((item, idx) => {
                    html += `
                        <tr>
                            <td><i class="${item.icon}" style="color:var(--primary-green); font-size:16px;"></i></td>
                            <td><a href="${item.url}" target="_blank" style="color:var(--text-main); font-weight:600; text-decoration:none;">${item.name} <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:10px; opacity:0.6;"></i></a></td>
                            <td><span class="tag">${item.section.toUpperCase()}</span></td>
                            <td style="color:var(--text-muted);">${item.desc}</td>
                            <td style="text-align:right;">${deleteBtnHtml(idx)}</td>
                        </tr>
                    `;
                });
                html += `</tbody></table></div>`;
                area.innerHTML = html;
            } else {
                let gridClass = currentView === 'compact' ? 'cards-grid compact-view' : 'cards-grid';
                let html = `<div class="${gridClass}">`;
                filtered.forEach((item, idx) => {
                    html += `
                        <a href="${item.url}" target="_blank" class="sub-card">
                            <div>
                                <div class="card-header-icon"><i class="${item.icon}"></i></div>
                                <div class="card-body">
                                    <h3>${item.name} <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:11px; opacity:0.6;"></i></h3>
                                    <p>${item.desc}</p>
                                </div>
                            </div>
                            <div class="card-footer-tags">
                                <span class="tag">${item.section.toUpperCase()}</span>
                                ${deleteBtnHtml(idx)}
                            </div>
                        </a>
                    `;
                });
                html += `</div>`;
                area.innerHTML = html;
            }
        }

        function switchView(mode) {
            currentView = mode;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            if(mode === 'grid') document.getElementById('btnGrid').classList.add('active');
            if(mode === 'compact') document.getElementById('btnCompact').classList.add('active');
            if(mode === 'list') document.getElementById('btnList').classList.add('active');
            renderMainContent(document.getElementById('searchInput').value);
        }

        function filterCards() {
            renderMainContent(document.getElementById('searchInput').value);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if(html.getAttribute('data-theme') === 'light') {
                html.setAttribute('data-theme', 'dark');
                icon.className = 'fa-solid fa-sun';
            } else {
                html.setAttribute('data-theme', 'light');
                icon.className = 'fa-solid fa-moon';
            }
        }

        function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }

        function verifyAdminLogin() {
            const val = document.getElementById('adminPassInput').value;
            if(val === adminPass) {
                isAdminLoggedIn = true;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardAdminSection').style.display = 'block';
                renderAll();
            } else {
                alert('Mật khẩu quản trị không chính xác!');
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('dashboardAdminSection').style.display = 'none';
            document.getElementById('adminPassInput').value = '';
            renderAll();
        }

        function addItem() {
            const section = document.getElementById('itemSection').value;
            const name = document.getElementById('itemName').value;
            const url = document.getElementById('itemUrl').value;
            const desc = document.getElementById('itemDesc').value;
            const icon = document.getElementById('itemIcon').value;

            if(!name || !url) {
                alert('Vui lòng nhập tên ứng dụng và đường dẫn URL!');
                return;
            }

            appData.push({ section, name, url, desc, icon });
            localStorage.setItem('ammonia_portal_v4_data', JSON.stringify(appData));
            renderAll();

            document.getElementById('itemName').value = '';
            document.getElementById('itemUrl').value = '';
            document.getElementById('itemDesc').value = '';
            alert('Đã thêm ứng dụng/link mới thành công!');
        }

        function deleteItem(index) {
            if(!isAdminLoggedIn) {
                alert('Bạn cần đăng nhập quyền Admin mới được phép xóa!');
                return;
            }
            if(confirm('Bạn có chắc muốn xóa mục này?')) {
                appData.splice(index, 1);
                localStorage.setItem('ammonia_portal_v4_data', JSON.stringify(appData));
                renderAll();
            }
        }

        function changeAdminPassword() {
            const newP = document.getElementById('newAdminPass').value;
            if(!newP || newP.length < 4) {
                alert('Mật khẩu mới phải có ít nhất 4 ký tự!');
                return;
            }
            adminPass = newP;
            localStorage.setItem('ammonia_admin_v4_pass', adminPass);
            document.getElementById('newAdminPass').value = '';
            alert('Cập nhật mật khẩu thành công!');
        }

        function renderAdminList() {
            const list = document.getElementById('adminItemsList');
            if(!list) return;
            list.innerHTML = '';
            appData.forEach((item, idx) => {
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid var(--border-color);">
                        <span><i class="${item.icon}" style="margin-right:6px; color:var(--primary-green);"></i> <b>[${item.section}]</b> ${item.name}</span>
                        <span style="color:#ef4444; cursor:pointer;" onclick="deleteItem(${idx})">[Xóa]</span>
                    </div>
                `;
            });
        }

        function resetDefaultData() {
            if(!isAdminLoggedIn) {
                alert('Cần quyền Admin để thực hiện!');
                return;
            }
            if(confirm('Khôi phục toàn bộ dữ liệu mặc định?')) {
                appData = defaultData;
                localStorage.setItem('ammonia_portal_v4_data', JSON.stringify(appData));
                renderAll();
                alert('Đã khôi phục thành công!');
            }
        }

        renderAll();
    </script>
</body>
</html>

    <style>
        :root {
            --primary-green: #00682B;
            --primary-green-dark: #004D20;
            --primary-green-light: #E6F4EA;
            --accent-yellow: #FFC72C;
            --sidebar-bg: #032512;
            --bg-light: #F4F7F5;
            --card-bg: #FFFFFF;
            --text-main: #1A2E26;
            --text-muted: #5C7066;
            --border-color: #E2E8F0;
            --sidebar-width: 270px;
            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px -5px rgba(0, 104, 43, 0.08);
            --transition: all 0.25s ease-in-out;
        }

        [data-theme="dark"] {
            --bg-light: #0B130F;
            --card-bg: #13221A;
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            --border-color: #1E3A2F;
            --sidebar-bg: #02140A;
            --primary-green-light: #133322;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; transition: background 0.3s; }

        .sidebar {
            width: var(--sidebar-width); background: var(--sidebar-bg); color: #ffffff;
            display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0;
            z-index: 1000; box-shadow: 4px 0 15px rgba(0,0,0,0.15); transition: var(--transition);
        }
        .sidebar-header {
            padding: 16px 20px; display: flex; align-items: center; gap: 12px;
            background: rgba(0,0,0,0.25); border-bottom: 1px solid rgba(255,255,255,0.08);

        .sidebar-brand-badge { background: var(--accent-yellow); color: #02140A; font-weight: 800; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
        .sidebar-brand-text h2 { font-size: 13px; font-weight: 700; color: #FFFFFF; }
        .sidebar-brand-text span { font-size: 10.5px; color: #CBD5E0; }

        .sidebar-menu { list-style: none; padding: 14px 10px; flex-grow: 1; overflow-y: auto; }
        .menu-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px; color: #4ADE80; margin: 16px 12px 8px 12px; font-weight: 700; }
        
        .sidebar-menu li a {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: #F1F5F9; text-decoration: none;
            border-radius: 8px; font-size: 13px; font-weight: 500; transition: var(--transition); margin-bottom: 3px; cursor: pointer;
        }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: rgba(255, 255, 255, 0.15); color: #FFFFFF; transform: translateX(4px); }
        .sidebar-menu li a i { font-size: 15px; width: 20px; text-align: center; }

        .sidebar-admin-footer { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.3); }
        .btn-sidebar-admin {
            width: 100%; background: rgba(255, 199, 44, 0.18); color: var(--accent-yellow); border: 1px solid rgba(255, 199, 44, 0.4);
            padding: 9px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition);
        }
        .btn-sidebar-admin:hover { background: var(--accent-yellow); color: #02140A; }

        .main-wrapper { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .top-header {
            background: var(--card-bg); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 99;
        }
        .header-brand-group { display: flex; align-items: center; gap: 14px; }
        .mobile-menu-btn {
            display: none; background: var(--primary-green-light); color: var(--primary-green); border: none;
            width: 40px; height: 40px; border-radius: 8px; font-size: 18px; cursor: pointer; align-items: center; justify-content: center;
        }
        .logo-dcm-container { display: flex; align-items: center; background: #ffffff; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .logo-svg { height: 36px; width: auto; }
        .header-title h1 { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .header-title p { font-size: 11px; color: var(--text-muted); }

        .header-actions { display: flex; align-items: center; gap: 10px; }
        .theme-toggle-btn {
            background: var(--primary-green-light); color: var(--primary-green); border: none;
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px;
        }
        .btn-home-header {
            background: var(--primary-green-light); color: var(--primary-green); border: 1px solid var(--primary-green);
            padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
        }
        .btn-home-header:hover { background: var(--primary-green); color: #fff; }

        .content-container { padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .toolbar-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; gap: 15px; flex-wrap: wrap; }
        .search-box-wrapper { position: relative; flex: 1; min-width: 220px; max-width: 320px; }
        .search-box-wrapper input {
            width: 100%; padding: 11px 16px 11px 42px; border-radius: 10px; border: 1px solid var(--border-color);
            background: var(--card-bg); color: var(--text-main); font-size: 13px; outline: none; box-shadow: var(--shadow-sm);
        }
        .search-box-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .filter-select { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 13px; outline: none; cursor: pointer; }

        .view-mode-buttons { display: flex; background: var(--card-bg); padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); gap: 4px; }
        .view-btn { background: transparent; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .view-btn.active, .view-btn:hover { background: var(--primary-green); color: #fff; }

        .section-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; width: 4px; height: 15px; background: var(--primary-green); border-radius: 2px; }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; margin-bottom: 32px; }
        .sub-card {
            background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);
            text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: space-between; transition: var(--transition);
        }
        .sub-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary-green); }
        .card-header-icon {
            width: 44px; height: 44px; border-radius: 10px; background: var(--primary-green-light); color: var(--primary-green);
            display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 14px;
        }
        .card-body h3 { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; display: flex; justify-content: space-between; }
        .card-body p { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
        .card-footer-tags { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .tag { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 10px; background: var(--primary-green-light); color: var(--primary-green); }

        .cards-grid.compact-view { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
        .cards-grid.compact-view .sub-card { padding: 14px; }
        .cards-grid.compact-view .card-header-icon { width: 34px; height: 34px; font-size: 14px; margin-bottom: 8px; }
        .cards-grid.compact-view .card-body p { display: none; }

        .list-table-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); overflow-x: auto; box-shadow: var(--shadow-sm); margin-bottom: 32px; }
        .custom-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; white-space: nowrap; }
        .custom-table th { background: var(--primary-green-light); color: var(--primary-green); padding: 12px 16px; font-weight: 700; }
        .custom-table td { padding: 12px 16px; border-top: 1px solid var(--border-color); color: var(--text-main); }
        .custom-table tr:hover { background: rgba(0,0,0,0.02); }

        .ns-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .ns-stat-card { background: var(--card-bg); border-radius: 12px; padding: 18px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
        .ns-stat-card h4 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .ns-stat-card .val { font-size: 22px; font-weight: 800; color: var(--primary-green); margin-top: 6px; }

        .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .chart-card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
        .chart-card h3 { font-size: 13.5px; font-weight: 700; margin-bottom: 14px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .chart-wrapper { position: relative; width: 100%; height: 240px; max-height: 240px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6);
            display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(3px); padding: 16px;
        }
        .modal { background: var(--card-bg); color: var(--text-main); width: 100%; max-width: 600px; border-radius: 14px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal h2 { font-size: 17px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); background: var(--bg-light); color: var(--text-main); border-radius: 6px; font-size: 13px; outline: none; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-primary { background: var(--primary-green); color: #fff; border: none; padding: 9px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
        .btn-secondary { background: var(--border-color); color: var(--text-main); border: none; padding: 9px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-export { background: #2563EB; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }

        .sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; backdrop-filter: blur(2px); }

        @media(max-width: 992px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.mobile-open { transform: translateX(0); }
            .main-wrapper { margin-left: 0; }
            .mobile-menu-btn { display: flex; }
            .content-container { padding: 16px; }
            .charts-container { grid-template-columns: 1fr; }
        }
    </style>
</head>

        function renderSidebar() {

                    nav.innerHTML += `<li><a ${clickAction} class="${(activePage === pageKey) ? 'active' : ''}"><i class="${item.icon}"></i> ${item.name}</a></li>`;

            });

                let dl = Number(ns["ĐANG LÀM"]) === 1;
                let actionTd = isAdminLoggedIn ? `<td style="text-align:right;"><button onclick="openNsModalForEdit('nhansu', ${idx})" style="background:none; border:none; color:#2563EB; cursor:pointer;"><i class="fa-solid fa-pen"></i></button></td>` : '';
                html += `<tr data-ca="${ns["CA"] || ''}"><td><b>${ns["HỌ VÀ TÊN"] || ''}</b></td><td>${ns["CHỨC DANH"] || ''}</td><td>${ns["CẤP BẬC"] || ''}</td><td><span class="tag">${ns["CA"] || ''}</span></td><td>${ns["ĐIỆN THOẠI"] || ''}</td><td>${ns["EMAIL"] || ''}</td><td>${dl?'Đang làm':'Khác'}</td>${actionTd}</tr>`;
            });
            container.innerHTML = html + `</tbody></table></div>`;
            setTimeout(renderChartsNs, 100);
        }

        function renderChartsNs() {
            Chart.register(ChartDataLabels);
            let kC = {}; nhanSuData.forEach(x => { let k = x["CA"] || "Khác"; kC[k] = (kC[k] || 0) + 1; });
            if(chartInstance1) chartInstance1.destroy();
            chartInstance1 = new Chart(document.getElementById('chartNsKip'), { type: 'doughnut', data: { labels: Object.keys(kC), datasets: [{ data: Object.values(kC), backgroundColor: ['#00682B', '#2563EB', '#D97706', '#9333EA', '#0D9488'] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' }, datalabels: { color: '#fff', font: { weight: 'bold' } } } } });

            let cC = {}; nhanSuData.forEach(x => { let c = x["CHỨC DANH"] || "Khác"; cC[c] = (cC[c] || 0) + 1; });
            if(chartInstance2) chartInstance2.destroy();
            chartInstance2 = new Chart(document.getElementById('chartNsCd'), { type: 'bar', data: { labels: Object.keys(cC), datasets: [{ data: Object.values(cC), backgroundColor: '#00682B', borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, datalabels: { anchor: 'end', align: 'top' } } } });
        }

        function renderBdttContent() {
            document.getElementById('pageMainTitle').innerText = "Nhân Sự BDTT2026 - Xưởng Amo";
            const container = document.getElementById('mainContentContainer');
            let totalNs = bdttNsData.length, nhomCount = new Set(bdttNsData.map(x => x["Nhóm / Cụm"])).size;
            let nhomTruongList = bdttNsData.filter(x => { let cv = (x["Chức Vụ"] || "").toLowerCase(), n = (x["Nhóm / Cụm"] || "").toLowerCase(); return cv.includes("trưởng") || cv.includes("chỉ huy") || cv.includes("quản đốc") || n.includes("chỉ huy"); });

            let adminToolsHtml = isAdminLoggedIn ? `<div style="background:var(--card-bg); padding:16px; border-radius:12px; border:1px solid var(--border-color); margin-bottom:20px; display:flex; gap:12px; align-items:center; justify-content:space-between;"><div style="display:flex; gap:12px; align-items:center;"><input type="file" id="excelFileUpBdtt" accept=".xlsx, .xls" style="font-size:12px;"><button class="btn-primary" onclick="handleExcelUploadBdtt()">Import BDTT</button></div><button class="btn-primary" onclick="openNsModalForAdd('bdtt')" style="background:#0D9488;">Thêm Nhân Sự BDTT</button></div>` : '';

            let html = `<div class="ns-stats-grid"><div class="ns-stat-card"><h4>Tổng nhân sự BDTT 2026</h4><div class="val">${totalNs}</div></div><div class="ns-stat-card"><h4>Số Nhóm / Cụm</h4><div class="val" style="color:#059669;">${nhomCount}</div></div></div>
                <div class="charts-container"><div class="chart-card"><h3>Phân bổ theo Nhóm / Cụm</h3><div class="chart-wrapper"><canvas id="chartBdttNhom"></canvas></div></div><div class="chart-card"><h3>Thống kê theo Chức vụ</h3><div class="chart-wrapper"><canvas id="chartBdttCv"></canvas></div></div></div>
                <div class="chart-card" style="margin-bottom: 24px;"><h3 style="margin-bottom: 14px;"><i class="fa-solid fa-address-book" style="color:#D97706;"></i> Danh Sách Nhóm Trưởng & SĐT Liên Hệ Nhanh</h3>
                <div class="list-table-container" style="margin-bottom: 0; box-shadow: none;"><table class="custom-table" style="font-size: 12.5px;"><thead><tr><th>NHÓM / CỤM</th><th>HỌ VÀ TÊN NHÓM TRƯỞNG</th><th>CHỨC VỤ</th><th>SỐ ĐIỆN THOẠI</th><th>THAO TÁC GỌI</th></tr></thead><tbody>`;

            nhomTruongList.forEach(nt => {
                let sdt = nt["Điện Thoại"] || "";
                let ten = nt["Họ and Tên"] || nt["Họ và Tên"] || "";
                html += `<tr><td><span class="tag">${nt["Nhóm / Cụm"] || ''}</span></td><td style="font-weight:700;">${ten}</td><td>${nt["Chức Vụ"] || ''}</td><td style="font-weight:600; color:var(--primary-green);">${sdt}</td><td>${sdt?`<a href="tel:${sdt}" class="tag" style="background:#059669; color:#fff; text-decoration:none; padding:4px 10px; display:inline-flex; align-items:center; gap:6px;"><i class="fa-solid fa-phone"></i> Gọi ${sdt}</a>`:'--'}</td></tr>`;
            });

            html += `</tbody></table></div></div>
                ${adminToolsHtml}
                <div class="toolbar-section">
                    <div class="search-box-wrapper"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="nsSearchInput" onkeyup="filterBdttTable()" placeholder="Tìm tên, nhóm, sđt..."></div>
                    <div style="display:flex; gap:10px;">
                        <select id="filterBdttNhom" class="filter-select" onchange="filterBdttTable()">
                            <option value="">-- Tất cả Nhóm / Cụm --</option>
                            <option value="Chỉ Huy Trưởng">Chỉ Huy Trưởng</option>
                            <option value="Hành Chính">Hành Chính</option>
                            <option value="Cụm 200">Cụm 200</option>
                            <option value="Cụm 300">Cụm 300</option>
                            <option value="Cụm 400-700">Cụm 400-700</option>
                            <option value="Cụm 500">Cụm 500</option>
                            <option value="TĐH/DCS">TĐH/DCS</option>
                            <option value="Đi Ca">Đi Ca</option>
                        </select>
                    </div>
                </div>
                <div class="section-title">Danh Sách Chi Tiết Thành Viên BDTT2026</div>
                <div class="list-table-container"><table class="custom-table" id="nsTable"><thead><tr><th>STT</th><th>HỌ VÀ TÊN</th><th>NHÓM / CỤM</th><th>ĐIỆN THOẠI</th><th>CHỨC VỤ</th><th>GHI CHÚ</th>${isAdminLoggedIn?'<th style="text-align:right;">THAO TÁC</th>':''}</tr></thead><tbody id="nsTableBody">`;

            bdttNsData.forEach((ns, idx) => {
                let ten = ns["Họ and Tên"] || ns["Họ và Tên"] || "";
                let nhom = ns["Nhóm / Cụm"] || "";
                let actionTd = isAdminLoggedIn ? `<td style="text-align:right;"><button onclick="openNsModalForEdit('bdtt', ${idx})" style="background:none; border:none; color:#2563EB; cursor:pointer;"><i class="fa-solid fa-pen"></i></button></td>` : '';
                html += `<tr data-nhom="${nhom}"><td>${idx + 1}</td><td><b>${ten}</b></td><td><span class="tag">${nhom}</span></td><td>${ns["Điện Thoại"] || ''}</td><td>${ns["Chức Vụ"] || ''}</td><td style="color:var(--text-muted);">${ns["Ghi Chú"] || ''}</td>${actionTd}</tr>`;
            });
            container.innerHTML = html + `</tbody></table></div>`;
            setTimeout(renderChartsBdtt, 100);
        }

        function renderChartsBdtt() {
            Chart.register(ChartDataLabels);
            let nC = {}; bdttNsData.forEach(x => { let n = x["Nhóm / Cụm"] || "Khác"; nC[n] = (nC[n] || 0) + 1; });
            if(chartInstance1) chartInstance1.destroy();
            chartInstance1 = new Chart(document.getElementById('chartBdttNhom'), { type: 'doughnut', data: { labels: Object.keys(nC), datasets: [{ data: Object.values(nC), backgroundColor: ['#00682B', '#2563EB', '#D97706', '#9333EA', '#0D9488', '#E11D48', '#EA580C', '#4F46E5'] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' }, datalabels: { color: '#fff', font: { weight: 'bold' } } } } });

            let cC = {}; bdttNsData.forEach(x => { let cv = (x["Chức Vụ"] || "").toLowerCase(); let key = (cv.includes("trưởng") || cv.includes("trách") || cv.includes("quản đốc")) ? "Chủ chốt / Nhóm trưởng" : "Thành viên"; cC[key] = (cC[key] || 0) + 1; });
            if(chartInstance2) chartInstance2.destroy();
            chartInstance2 = new Chart(document.getElementById('chartBdttCv'), { type: 'bar', data: { labels: Object.keys(cC), datasets: [{ data: Object.values(cC), backgroundColor: '#2563EB', borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, datalabels: { anchor: 'end', align: 'top' } } } });
        }

        function publishAndDownloadCode() {
            let dummyDoc = document.cloneNode(true);
            let fullHtmlCode = `<!DOCTYPE html>\n` + dummyDoc.documentElement.outerHTML;
            const blob = new Blob([fullHtmlCode], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'index.html';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            alert('Đã tải về file index.html mới nhất!');
        }

        function openNsModalForAdd(type) {
            document.getElementById('nsEditIndex').value = -1;
            const fc = document.getElementById('modalFieldsContainer');
            if(type === 'nhansu') {
                document.getElementById('nsModalTitle').innerHTML = `<span>Thêm Nhân Sự Xưởng</span> <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeNsModal()"></i>`;
                fc.innerHTML = `<input type="hidden" id="modalType" value="nhansu"><div class="form-group"><label>HỌ VÀ TÊN (*)</label><input type="text" id="mName"></div><div class="form-group"><label>CHỨC DANH</label><input type="text" id="mChucDan"></div><div class="form-group"><label>CẤP BẬC</label><input type="text" id="mCapBac"></div><div class="form-group"><label>CA / KÍP</label><input type="text" id="mCa"></div><div class="form-group"><label>ĐIỆN THOẠI</label><input type="text" id="mPhone"></div><div class="form-group"><label>EMAIL</label><input type="text" id="mEmail"></div><div class="form-group"><label>ĐANG LÀM</label><select id="mDangLam"><option value="1">1 - Đang làm</option><option value="0">0 - Khác</option></select></div>`;
            } else {
                document.getElementById('nsModalTitle').innerHTML = `<span>Thêm Nhân Sự BDTT2026</span> <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeNsModal()"></i>`;
                fc.innerHTML = `<input type="hidden" id="modalType" value="bdtt"><div class="form-group"><label>HỌ VÀ TÊN (*)</label><input type="text" id="mName"></div><div class="form-group"><label>NHÓM / CỤM</label><input type="text" id="mNhom"></div><div class="form-group"><label>ĐIỆN THOẠI</label><input type="text" id="mPhone"></div><div class="form-group"><label>CHỨC VỤ</label><input type="text" id="mChucVu"></div><div class="form-group"><label>GHI CHÚ</label><input type="text" id="mGhiChu"></div>`;
            }
            document.getElementById('nsModal').style.display = 'flex';
        }

        function openNsModalForEdit(type, idx) {
            document.getElementById('nsEditIndex').value = idx;
            const fc = document.getElementById('modalFieldsContainer');
            if(type === 'nhansu') {
                let ns = nhanSuData[idx];
                document.getElementById('nsModalTitle').innerHTML = `<span>Sửa Nhân Sự Xưởng</span> <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeNsModal()"></i>`;
                fc.innerHTML = `<input type="hidden" id="modalType" value="nhansu"><div class="form-group"><label>HỌ VÀ TÊN (*)</label><input type="text" id="mName" value="${ns["HỌ VÀ TÊN"]||''}"></div><div class="form-group"><label>CHỨC DANH</label><input type="text" id="mChucDan" value="${ns["CHỨC DANH"]||''}"></div><div class="form-group"><label>CẤP BẬC</label><input type="text" id="mCapBac" value="${ns["CẤP BẬC"]||''}"></div><div class="form-group"><label>CA / KÍP</label><input type="text" id="mCa" value="${ns["CA"]||''}"></div><div class="form-group"><label>ĐIỆN THOẠI</label><input type="text" id="mPhone" value="${ns["ĐIỆN THOẠI"]||''}"></div><div class="form-group"><label>EMAIL</label><input type="text" id="mEmail" value="${ns["EMAIL"]||''}"></div><div class="form-group"><label>ĐANG LÀM</label><select id="mDangLam"><option value="1" ${Number(ns["ĐANG LÀM"])===1?'selected':''}>1</option><option value="0" ${Number(ns["ĐANG LÀM"])===0?'selected':''}>0</option></select></div>`;
            } else {
                let ns = bdttNsData[idx];
                let ten = ns["Họ and Tên"] || ns["Họ và Tên"] || "";
                document.getElementById('nsModalTitle').innerHTML = `<span>Sửa Nhân Sự BDTT2026</span> <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeNsModal()"></i>`;
                fc.innerHTML = `<input type="hidden" id="modalType" value="bdtt"><div class="form-group"><label>HỌ VÀ TÊN (*)</label><input type="text" id="mName" value="${ten}"></div><div class="form-group"><label>NHÓM / CỤM</label><input type="text" id="mNhom" value="${ns["Nhóm / Cụm"]||''}"></div><div class="form-group"><label>ĐIỆN THOẠI</label><input type="text" id="mPhone" value="${ns["Điện Thoại"]||''}"></div><div class="form-group"><label>CHỨC VỤ</label><input type="text" id="mChucVu" value="${ns["Chức Vụ"]||''}"></div><div class="form-group"><label>GHI CHÚ</label><input type="text" id="mGhiChu" value="${ns["Ghi Chú"]||''}"></div>`;
            }
            document.getElementById('nsModal').style.display = 'flex';
        }

        function closeNsModal() { document.getElementById('nsModal').style.display = 'none'; }

        function saveNsDataModal() {
            let type = document.getElementById('modalType').value;
            let idx = parseInt(document.getElementById('nsEditIndex').value);
            let name = document.getElementById('mName').value.trim();
            if(!name) { alert('Nhập họ tên!'); return; }

            if(type === 'nhansu') {
                let item = { "HỌ VÀ TÊN": name, "CHỨC DANH": document.getElementById('mChucDan').value.trim(), "CẤP BẬC": document.getElementById('mCapBac').value.trim(), "CA": document.getElementById('mCa').value.trim(), "ĐIỆN THOẠI": document.getElementById('mPhone').value.trim(), "EMAIL": document.getElementById('mEmail').value.trim(), "ĐANG LÀM": parseInt(document.getElementById('mDangLam').value) };
                if(idx === -1) nhanSuData.push(item); else nhanSuData[idx] = item;
                localStorage.setItem('ammonia_nhansu_v13_data', JSON.stringify(nhanSuData));
            } else {
                let item = { "Họ and Tên": name, "Nhóm / Cụm": document.getElementById('mNhom').value.trim(), "Điện Thoại": document.getElementById('mPhone').value.trim(), "Chức Vụ": document.getElementById('mChucVu').value.trim(), "Ghi Chú": document.getElementById('mGhiChu').value.trim() };
                if(idx === -1) bdttNsData.push(item); else bdttNsData[idx] = item;
                localStorage.setItem('bdtt2026_nhansu_v10_data', JSON.stringify(bdttNsData));
            }
            closeNsModal(); renderAll(); alert('Lưu thông tin thành công!');
        }

        function handleExcelUploadNs() {
            const fi = document.getElementById('excelFileUp');
            if(!fi.files || fi.files.length === 0) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    nhanSuData = XLSX.utils.sheet_to_json(sheet, {defval: ""});
                    localStorage.setItem('ammonia_nhansu_v13_data', JSON.stringify(nhanSuData));
                    renderAll(); alert('Import nhân sự xưởng thành công!');
                } catch(err) { alert('Lỗi đọc file Excel!'); }
            };
            reader.readAsArrayBuffer(fi.files[0]);
        }

        function handleExcelUploadBdtt() {
            const fi = document.getElementById('excelFileUpBdtt');
            if(!fi.files || fi.files.length === 0) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    bdttNsData = XLSX.utils.sheet_to_json(sheet, {defval: ""});
                    localStorage.setItem('bdtt2026_nhansu_v10_data', JSON.stringify(bdttNsData));
                    renderAll(); alert('Import BDTT thành công!');
                } catch(err) { alert('Lỗi đọc file Excel!'); }
            };
            reader.readAsArrayBuffer(fi.files[0]);
        }

        function restoreFullBackupExcel() {
            const fi = document.getElementById('masterBackupFile');
            if(!fi.files || fi.files.length === 0) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                    wb.SheetNames.forEach(sn => {
                        let snLower = sn.toLowerCase();
                        const sheetObj = wb.Sheets[sn];
                        if(snLower.includes("web") || snLower.includes("link")) {
                            appData = XLSX.utils.sheet_to_json(sheetObj, {defval: ""});
                            localStorage.setItem('ammonia_portal_v18_data', JSON.stringify(appData));
                        }
                        if(snLower.includes("xuong")) {
                            nhanSuData = XLSX.utils.sheet_to_json(sheetObj, {defval: ""});
                            localStorage.setItem('ammonia_nhansu_v13_data', JSON.stringify(nhanSuData));
                        }
                        if(snLower.includes("bdtt")) {
                            bdttNsData = XLSX.utils.sheet_to_json(sheetObj, {defval: ""});
                            localStorage.setItem('bdtt2026_nhansu_v10_data', JSON.stringify(bdttNsData));
                        }
                    });
                    renderAll(); alert('Khôi phục backup thành công!');
                } catch(err) { alert('Lỗi file!'); }
            };
            reader.readAsArrayBuffer(fi.files[0]);
        }

        function exportExcelAll() {
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(appData), "WebApps_Links");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(nhanSuData), "NhanSu_Xuong");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bdttNsData), "Nhansu_BDTT2026");
            XLSX.writeFile(wb, "Ammonia_Backup.xlsx");
        }

        function filterNhanSuTable() {
            const kw = document.getElementById('nsSearchInput').value.toLowerCase(), fC = document.getElementById('filterCa').value;
            document.querySelectorAll('#nsTableBody tr').forEach(tr => { let match = tr.innerText.toLowerCase().includes(kw) && (!fC || tr.getAttribute('data-ca') === fC); tr.style.display = match ? '' : 'none'; });
        }
        function filterBdttTable() {
            const kw = document.getElementById('nsSearchInput').value.toLowerCase();
            const fNhom = document.getElementById('filterBdttNhom').value;
            document.querySelectorAll('#nsTableBody tr').forEach(tr => {
                let textMatch = tr.innerText.toLowerCase().includes(kw);
                let nhomVal = tr.getAttribute('data-nhom') || '';
                let nhomMatch = !fNhom || nhomVal === fNhom;
                tr.style.display = (textMatch && nhomMatch) ? '' : 'none';
            });
        }

        function switchView(mode) {
            currentView = mode;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            if(mode === 'grid') document.getElementById('btnGrid').classList.add('active');
            if(mode === 'compact') document.getElementById('btnCompact').classList.add('active');
            if(mode === 'list') document.getElementById('btnList').classList.add('active');
            renderCardsGrid(appData, document.getElementById('searchInput').value);
        }

        function filterCards() { renderCardsGrid(appData, document.getElementById('searchInput').value); }
        function toggleTheme() { const h = document.documentElement, i = document.getElementById('themeIcon'); if(h.getAttribute('data-theme')==='light') { h.setAttribute('data-theme','dark'); i.className='fa-solid fa-sun'; } else { h.setAttribute('data-theme','light'); i.className='fa-solid fa-moon'; } }
        
        function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('dashboardAdminSection').style.display = 'none';
            document.getElementById('adminPassInput').value = '';
            document.getElementById('adminBtnText').innerText = "Quản Trị Hệ Thống";
            closeAdminModal(); renderAll();
        }

        function verifyAdminLogin() {
            if(document.getElementById('adminPassInput').value === adminPass) {
                isAdminLoggedIn = true;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardAdminSection').style.display = 'block';
                document.getElementById('adminBtnText').innerText = "Quản Trị (Đã đăng nhập)";
                closeAdminModal(); renderAll();
            } else alert('Sai mật khẩu!');
        }

        function deleteItem(idx) {
            if(confirm('Xóa mục này?')) { appData.splice(idx, 1); localStorage.setItem('ammonia_portal_v18_data', JSON.stringify(appData)); renderAll(); }
        }

        function resetDefaultData() {
            if(confirm('Khôi phục toàn bộ dữ liệu mặc định?')) {
                localStorage.removeItem('ammonia_portal_v18_data');
                localStorage.removeItem('ammonia_nhansu_v13_data');
                localStorage.removeItem('bdtt2026_nhansu_v10_data');
                appData = defaultData; nhanSuData = defaultNhanSu; bdttNsData = defaultBdttNs;
                renderAll(); closeAdminModal(); alert('Đã khôi phục dữ liệu mặc định thành công!');
            }
        }

        renderAll();
    </script>
</body>
